# ==============================================================================
# Render Blueprint Specification - Verisource Autonomous S2P Platform
# https://render.com/docs/blueprint-spec
# ==============================================================================
# Deploy with 1 Click on Render:
# 1. Push this repo to GitHub
# 2. Go to https://dashboard.render.com -> Blueprints -> New Blueprint Instance
# 3. Connect your repository - Render will provision all 3 services automatically!
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service: Verisource Express REST API & AI Copilot Engine
  # ----------------------------------------------------------------------------
  - type: web
    name: verisource-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false # Set in Render dashboard or prompt on first deploy

  # ----------------------------------------------------------------------------
  # 2. Supplier Portal: Verisource B2B Supplier Steward & Public Profile
  # ----------------------------------------------------------------------------
  - type: web
    name: verisource-supplier-portal
    runtime: static
    plan: free
    region: oregon
    rootDir: supplier-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: verisource-api
          property: host

  # ----------------------------------------------------------------------------
  # 3. Buyer Portal: Apex Global Buyer Operations Cockpit
  # ----------------------------------------------------------------------------
  - type: web
    name: verisource-buyer-portal
    runtime: static
    plan: free
    region: oregon
    rootDir: buyer-portal
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: verisource-api
          property: host
