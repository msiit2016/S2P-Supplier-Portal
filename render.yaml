# ==============================================================================
# Render Blueprint Specification - Verisource Live Supplier Portal
# ==============================================================================
# Runs the full Supplier Portal (React frontend + Express API + Ava AI Copilot)
# in a single live Web Service, exactly like local development.
# ==============================================================================

version: "1"

services:
  - type: web
    name: verisource-supplier-portal
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build:supplier
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
